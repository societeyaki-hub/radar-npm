name: Radar npm — mise à jour quotidienne

on:
  schedule:
    - cron: "17 5 * * *"   # chaque jour à 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collecte et génération du site
        run: node scripts/build.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit des données et de l'historique
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore: mise à jour quotidienne $(date -u +%F)"
            git push
          fi

  pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
